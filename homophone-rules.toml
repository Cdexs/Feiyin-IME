# HOMOPHONE-NODE-318 · 同音纠错替换表（变体 → 本体）
#
# 用途：ASR 听错（同音/近音替换型）的**单向**纠正，挂在 run_pipeline_core 转录后、ITN 前。
# 载入：exe 同级 homophone-rules.toml 覆盖；缺失/解析失败 → 回退本文件（include_str! 内置默认）。
#        ⇒ 以后加词条只换 toml，不用出包（同 itn-rules.toml，DEC-011）。
#
# 🔴 收录判据（一条不满足即不收）：
#   1) 单向无歧义：变体在**任何语境**下都不是合法词（用 jieba 498k 词典核过「变体非词」）；
#      两边都成立的（不单/不但、惟独/唯独、做美/作美、的/地/得 语法类）**一律不收**；
#   2) ASR 真会犯：变体与本体的差异字**同音且同调**（pypinyin TONE3 比对），非字形/键位错；
#   3) 变体不出现在任何更长词内（jieba 全词表子串扫描），防「替换吃掉长词」
#      （如「成工」曾嵌于「完成工作」⇒ 已剔除）；
#   4) 变体不含繁体字/语法助词（防 zh-Hant 输出被误改）。
#
# 来源：shibing624/pycorrector tests/custom_confusion.txt（Apache-2.0）
#       经上述 1)~4) 四道过滤后人工复核；**非整份导入**。
