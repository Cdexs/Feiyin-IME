# AUTOLEARN-CANDIDATE-327 · 自学习候选「二次收窄」规则（变体 → 干净词）
#
# 背景：`extract_correction_word` 按【字符】diff（掐公共前缀+公共后缀），当 ASR 把句子
# 后半段也听错时公共后缀为空，候选会一路吞到句尾（含标点/整短语）。本表是收窄用的字符集。
#
# 🔴 只让「送进 is_valid_candidate 的东西更干净」，**不放宽任何校验/门槛**：
#    - 门槛 threshold 不降；is_valid_candidate 的拒绝理由一条不动（句末标点/换行/编号…）
#    - 收窄必须保守：宁可抽不出（返回 None）也不要抽出垃圾（脏词条会长期影响 ASR 偏置）
#
# 载入：exe 同级同名文件优先；缺失/解析失败 → 回退本文件（include_str! 内置默认）。
#       照 itn-rules.toml / homophone-rules.toml 先例（DEC-011）。

[extract]
# 句末标点：收窄第 1 步，在首个句末标点处截断。
sentence_enders = "。！？；"

# 虚词：收窄第 2 步，在首个虚词处切出**前导词块**（如「指导灵的信息吗」→「指导灵」）。
#
# 🔴 收「是 / 在」是**知情选择**，依据是 MAX_CANDIDATE_CHARS=30 的不对称代价：
#    不切时，「指导灵是一种能量」这类 8 字跨度**无句末标点、也不超 30 上限**
#    ⇒ is_valid_candidate 拦不住 ⇒ 整条短语进候选表、够两次就进用户可见词库；
#    切了最坏只是抽不出（潜在→「潜」→None 被后续判据丢弃），无残留。
#    一边永久污染、一边一次漏抽 ⇒ 按「宁可抽不出」，保留 是/在。
# ⚠️ 已知会误伤（真实碰撞，非「提示」——示≠是）：潜在 / 内在 / 存在 / 实在 / 现在 /
#    正在 / 但是 / 于是 / 总是 … 这类以虚词字开头的词会被切短而抽不出，属可接受代价。
function_words = "的了吗呢吧啊呀嘛哦嗯是在"
