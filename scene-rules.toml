    "QQ.exe",              # QQ（经典版）
    "QQNT.exe",            # QQ NT 架构（新版 QQ 桌面端）
    "TIM.exe",             # TIM（QQ 商务版）
    "Telegram.exe",        # Telegram
    "DingTalk.exe",        # 钉钉
    "DingTalkLite.exe",    # 钉钉 Lite（macOS/精简版，如有 Windows 版）
