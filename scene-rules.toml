# scene-rules.toml — SCENE-SENSE-001-CORE 场景感知规则配置
#
# 本文件是场景分类的规则数据，与 src/scene/mod.rs 算法分离。
# 内置默认通过 include_str! 嵌入同一份文件；运行时 exe 同级存在则覆盖。
# Gavin 可手动编辑此文件调整规则，无需改代码。
#
# 匹配优先级：exe 精确匹配（不区分大小写）→ 标题关键词 → Unknown。
# Unknown = 不注入 F4 场景段，multiline_safe 按 false 保守处理（等同 Phase 1）。
#
# 字段说明：
#   kind          = 场景类别（chat/email/ide_terminal/doc/browser）
#   exe           = 进程 exe 名列表（不区分大小写精确匹配）
#   title_keywords= 窗口标题关键词（兜底匹配，主要用于浏览器场景细分）
#   style         = 风格指令（写入 LLM prompt F4 段，不含 exe 名/标题）
#   multiline_safe= 多行注入是否安全（false 时禁用 F3 结构重组 + flatten 单行化 + 强制剪贴板）
#   bundle_id     = macOS 预留字段（Phase 4 实施，当前忽略）
#
# DEC-031-⑤: 词表尽可能详细，不限于每类 5-8 个。

# ============================================================
# 聊天/即时通讯（multiline_safe=false，Enter=发送，多行注入危险）
# ============================================================

