kind = "chat"
style = "Natural conversational tone, short and direct. Keep it casual. Do NOT use lists, headings, or formal written structure."
multiline_safe = false
exe = [
    "WeChat.exe",          # 微信 3.x（旧版）
    "Weixin.exe",          # 微信 4.x（新版，2024+ 重构版进程名改为 Weixin）
