# ============================================================
# 邮件客户端（multiline_safe=true，多行正文安全）
# ============================================================

[[scene]]
kind = "email"
style = "Formal email writing style. The dictation may be ANY FRAGMENT of an email (often body text only). Format ONLY what was spoken — NEVER add a salutation, closing, signature, greeting, or any sentence the speaker did not say; do NOT complete the text into a full email. IF (and only if) the spoken text itself begins with a salutation (Chinese: 尊敬的X / X您好; English: Dear X,; Japanese: 拝啓 X様 / X様 / 〇〇様; Korean: X님 / 안녕하십니까 X님, etc.): put it on its own line ending with a colon — '：' for Chinese, ':' for English/Japanese/Korean — NEVER a comma or period — and start the body on the next line. IF the spoken text itself ends with a closing courtesy (Chinese: 祝好 / 顺祝商祺; English: Best regards,; Japanese: よろしくお願いいたします / 敬具; Korean: 감사합니다 / 이상, etc.): place it on its own line; the pair 此致/敬礼 goes on two separate lines; Japanese 敬具/前略 and Korean 이상 go on their own lines. Body in complete sentences. When the speech contains enumeration markers (第一/第二/首先/其次/最后 / firstly/secondly / まず/次に/最後に / 첫째/둘째/마지막으로 etc.), MUST split into numbered list lines."
multiline_safe = true
exe = [
    "OUTLOOK.EXE",         # Outlook（classic 经典版）
    "olk.exe",             # Outlook（new 新版，2024+ Win11 默认，WebView2 重构）
    "Foxmail.exe",         # Foxmail
    "thunderbird.exe",     # Thunderbird
    "MailMaster.exe",      # 网易邮箱大师
    "YoMail.exe",          # YoMail
    "Mail.exe",            # Windows 10/11 自带邮件（旧版 UWP）
    "HxOutlook.exe",       # Outlook 辅助进程（新版 Outlook 后台进程）
    "eMClient.exe",        # eM Client
    "Spark.exe",           # Spark Mail
    # --- 新增邮件客户端 ---
    "CalendarApp.Gui.Win10.exe", # ✅实测：OneCalendar（MSIX 包 64885BlueEdge.OneCalendar，AppxManifest Executable=CalendarApp.Gui.Win10.exe）
    "Mailbird.exe",        # ⚠️未证实：Mailbird（官网 mailbird.com 有 Windows 包，exe 名未实测）
    "The Bat!.exe",        # ⚠️未证实：The Bat!（官网 ritlabs.com 有 Windows 包，exe 名未实测）
    # --- DATA-SCENE-COVERAGE-004 新增：邮件桌面客户端（3c，三级证据标注，六条必收多候选名并存）---
    # 口径：exe 是精确集合匹配，多写一个不命中的名字零副作用，漏写才会静默失效（Todo.exe 教训）。
    "BlueMail.exe",        # 📄file.net 实测：BlueMail（Blix Inc，C:\Program Files\BlueMail\）；⚠️Win11 下部分版本 exe 名可能变化（file.net 用户评论），另有 Windows Store 包 BlueMail.BlueMailEmail
    "Blue Mail.exe",       # ⚠️候选名并存：BlueMail 含空格变体
    "Mailspring.exe",      # 📄官方 getmailspring.com 支持 Windows 原生桌面版；⚠️进程名惯例（Electron 产物名 = 产品名，未实测）
    "Mailspring Native.exe", # ⚠️候选名并存：部分安装产物变体
    "Postbox.exe",         # 📄官方 postbox-inc.com 支持 macOS+Windows；⚠️已被 eM Client 收购，进程名惯例（未实测）
    "claws-mail.exe",      # 📄官方 claws-mail.org 有 Windows 构建（GTK 邮件客户端）；⚠️进程名按 Unix 惯例小写带连字符，未实测
    "ClawsMail.exe",       # ⚠️候选名并存：驼峰拼写变体
    "Canary Mail.exe",     # 📄官方 canarymail.io 支持 Windows 桌面版；⚠️进程名惯例（Electron 产物名含空格），未实测
    "CanaryMail.exe",      # ⚠️候选名并存：无空格变体
    "ZohoMail.exe",        # ⚠️未证实：Zoho Mail 桌面版（官方 zoho.com/mail 有桌面客户端，exe 名未实测）
    "Zoho Mail.exe",       # ⚠️候选名并存：Zoho Mail 含空格变体
    # --- DATA-SCENE-COVERAGE-004 新增：macOS 自带 Mail（双形式并存）---
    # 注意：此处的 Mail（无 .exe）是 macOS 自带邮件，与上方 Mail.exe（Windows 10/11 自带邮件）是不同字符串，可共存，勿误删其一。
    "Mail",                # macOS 自带邮件 Mail（localizedName 形式 A，无 .exe 后缀）
    "com.apple.mail",      # macOS 自带邮件 Mail（bundleIdentifier 形式 B）
]

[[scene]]
kind = "email"
style = "Formal email writing style. The dictation may be ANY FRAGMENT of an email (often body text only). Format ONLY what was spoken — NEVER add a salutation, closing, signature, greeting, or any sentence the speaker did not say; do NOT complete the text into a full email. IF (and only if) the spoken text itself begins with a salutation (Chinese: 尊敬的X / X您好; English: Dear X,; Japanese: 拝啓 X様 / X様 / 〇〇様; Korean: X님 / 안녕하십니까 X님, etc.): put it on its own line ending with a colon — '：' for Chinese, ':' for English/Japanese/Korean — NEVER a comma or period — and start the body on the next line. IF the spoken text itself ends with a closing courtesy (Chinese: 祝好 / 顺祝商祺; English: Best regards,; Japanese: よろしくお願いいたします / 敬具; Korean: 감사합니다 / 이상, etc.): place it on its own line; the pair 此致/敬礼 goes on two separate lines; Japanese 敬具/前略 and Korean 이상 go on their own lines. Body in complete sentences. When the speech contains enumeration markers (第一/第二/首先/其次/最后 / firstly/secondly / まず/次に/最後に / 첫째/둘째/마지막으로 etc.), MUST split into numbered list lines."
multiline_safe = true
title_keywords = [
    "Outlook", "Foxmail", "Thunderbird", "邮件", "邮箱",
    "Mail", "Gmail", "Inbox", "收件箱", "发件箱", "Yahoo Mail", # FIX-SCENE-TITLE-LONGEST-001：从 browser 块移入（网页邮箱应归 email，且其比 Mail/Inbox 严格更长，留在 browser 会被方案 A 的严格更长胜出坐实错分类）
    "Hotmail", # DATA-SCENE-COVERAGE-004：Outlook.com 旧品牌，老用户书签/标题仍为 Hotmail（7 字符比 Mail 长，最长匹配下正确胜出）
]

# ============================================================
# 纯终端 + 模态编辑器（multiline_safe=false）
# ============================================================
# 纯终端：多行 = 逐行执行命令，危险
# vim/gvim 是模态编辑器：注入字符在 normal 模式下被当命令键执行（d 删除行、x 删字符）→ 会真实改坏文件，
# 风险量级不同于 GUI IDE，故不随本批放开（主控裁定，已告知 Gavin）。
# GUI IDE/编辑器（VS Code/Cursor/Windsurf/Zed/JetBrains 全家/devenv/HBuilderX/Notepad++/Sublime Text）
# 已移至下方 multiline_safe=true 块（Gavin 2026-08-01 裁定代码/文字编辑生成类软件放开多行，方案 A）。
# ============================================================

[[scene]]
kind = "ide_terminal"
style = "Technical style. Preserve English for technical terms, code identifiers, and jargon. No pleasantries."
multiline_safe = false
exe = [
    # 纯终端（6 条核心）
    "WindowsTerminal.exe", # Windows Terminal
    "cmd.exe",             # 命令提示符
    "powershell.exe",      # PowerShell
    "pwsh.exe",            # PowerShell 7
    "ConEmu64.exe",        # ConEmu
    "ConEmu.exe",          # ConEmu
    # 模态编辑器（注入字符被当命令键执行会改坏文件，不放开）
    "vim.exe",             # Vim
    "gvim.exe",            # Vim / gvim
    # 其余纯终端（同属 multiline_safe=false，防止落入 Unknown）
    "Cmder.exe",           # Cmder
    "Alacritty.exe",       # Alacritty
    "wezterm-gui.exe",     # WezTerm
    "mintty.exe",          # mintty（Git Bash 默认终端）
    "putty.exe",           # PuTTY
    "Xshell.exe",          # Xshell
    "Xshell6.exe",         # Xshell 6
    "Xshell7.exe",         # Xshell 7
    "Xshell8.exe",         # Xshell 8
    "Xagent.exe",          # ✅实测：Xshell 8 配套（本机 D:\xshell\Xagent.exe 与 D:\xftp\Xagent.exe 均存在，Xagent 取代部分 Xftp 功能）
    "SecureCRT.exe",       # SecureCRT
    "MobaXterm.exe",       # MobaXterm
    "MobaXterm1.exe",      # MobaXterm（个人版）
    "Tabby.exe",           # Tabby Terminal
    "Hyper.exe",           # Hyper Terminal
    # --- 经典控制台宿主（CLI 类 Agent 命中路径）---
    # cmd/powershell 在经典控制台直启时前台窗口属主是 conhost 而非 shell 进程；
    # 这是 claude code/codex cli/opencode cli/aider 等 CLI Agent 的实际命中路径之一。
    "conhost.exe",         # Windows 经典控制台宿主（cmd/powershell 默认）
    "OpenConsole.exe",     # Windows Terminal / WezTerm 等附带的 OpenConsole 宿主
    # --- 新增终端/Shell ---
    "wezterm.exe",         # ✅实测：WezTerm（本机 %LocalAppData%\Programs\WezTerm\wezterm.exe，gui 入口 wezterm-gui.exe 已在表内）
    "git-bash.exe",        # ✅实测：Git Bash MSYS2 启动器（本机 C:\Program Files\Git\git-bash.exe，实际前台窗口通常为已在表内的 mintty.exe，此条为补漏）
    "Nu.exe",              # ⚠️未证实：Nushell（官网 nushell.sh 有 Windows zip 包含 nu.exe，exe 名未实测）
    # --- DATA-SCENE-COVERAGE-004 新增：macOS 终端（双形式并存，必须进 false 块）---
    # 与 Windows 终端同理：多行 = 逐行执行命令，危险。macOS 侧 stub 未生效，但不能留将来一实现就出事的坑。
    "Terminal",            # macOS 自带终端 Terminal（localizedName 形式 A，无 .exe 后缀）
    "com.apple.Terminal",  # macOS 自带终端 Terminal（bundleIdentifier 形式 B）
    "iTerm2",              # macOS iTerm2（localizedName 形式 A）
    "com.googlecode.iterm2", # macOS iTerm2（bundleIdentifier 形式 B）
]

# ============================================================
# 代码/文字编辑生成类软件（multiline_safe=true，放开多行）
# IMPL-SCENE-MULTILINE-002：Gavin 2026-08-01 裁定 + 方案 A 拍板
# 原话：「传统类的代码/文字编辑软件、IDE（比如 VisualStudio / jetbrains 等）应该按照
#       multiline-safe=true 来处理……他们毕竟不同于最新的 claude/codex 这种基于对话的
#       环境，他们属于代码/文字编辑生成类软件。」
# 主控已完整陈述内置终端风险（口述中文散句注入集成终端的实际后果是 command not found
# 噪音而非破坏），Gavin 听取后重申 → 按 Gavin 判断执行。
# 接受 F3 Smart Lists 会插列表（方案 A）。
# 技术风格沿用 ide_terminal（保留英文术语/代码标识符）。
# classify 首个匹配即返回，故以下条目已从上方 multiline_safe=false 块删除，否则此块永不命中。
# ============================================================

