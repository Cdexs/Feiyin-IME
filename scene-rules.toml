# ============================================================
# AI Agent / 助手桌面应用（multiline_safe=false，输入框 Enter=发送，多行注入危险）
# CLI 类 Agent（claude code/codex cli/opencode cli/aider 等）跑在终端内，
# 前台进程=终端 exe，已由 ide_terminal 词表 + conhost/OpenConsole 补条覆盖；
# 仅当有官方独立桌面壳时才在此列入 exe 条目。
# ============================================================

[[scene]]
kind = "chat"
style = "The dictated text is a prompt or instruction addressed to an AI assistant or coding agent. Keep the intent and wording intact. Preserve technical terms, code identifiers, file paths, and English words as-is. Clear and direct. Do NOT use lists, headings, or greetings; output as a single message."
multiline_safe = false
exe = [
    # --- 国际 AI 助手桌面版 ---
    "Claude.exe",              # Anthropic Claude 桌面版（MS Store 包 Claude，AppxManifest Executable=app\Claude.exe；本机核实）
    "ChatGPT.exe",             # OpenAI ChatGPT/Codex 桌面版（MS Store 包 OpenAI.Codex，AppxManifest Executable=app/ChatGPT.exe；本机核实）
    "Codex.exe",               # OpenAI Codex 桌面版独立入口（同 OpenAI.Codex 包内 Codex.exe；本机核实）
    "OpenCode.exe",            # OpenCode 桌面版（anomalyco/opencode desktop，安装路径 Programs/@opencode-aidesktop/OpenCode.exe；本机核实）
    "CherryStudio.exe",        # Cherry Studio（CherryHQ/cherry-studio，electron-builder.yml executableName=CherryStudio；核实）
    "Chatbox.exe",             # Chatbox（chatboxai/chatbox，electron-builder.yml productName=Chatbox；核实）
    "jan.exe",                 # Jan（janhq/jan，README 明确 Windows=jan.exe；核实）
    "AnythingLLMDesktop.exe",  # AnythingLLM Desktop（Mintplex-Labs/anything-llm release 资产 AnythingLLMDesktop.exe；核实）
    # --- 国产 AI 助手桌面版 ---
    "yuanbao.exe",             # 腾讯元宝（本机快捷方式 target=D:\Tencent\Yuanbao\yuanbao.exe；核实）
    # --- MS Store PWA 形态（Gemini/Copilot/DeepSeek/claude.ai 等）---
    # 前台进程为 msedge.exe（已在 browser exe 列表），靠下方 title_keywords 兜底，不在此列 exe 条目
]
title_keywords = [
    # 浏览器网页版 / PWA 兜底（浏览器开 claude.ai / chatgpt.com 等时靠窗口标题命中）
    "ChatGPT", "Claude", "Gemini", "Copilot", "Perplexity", "DeepSeek",
    "Kimi", "豆包", "通义千问", "文心一言", "元宝", "Grok", "Poe",
]

# ============================================================
# 邮件客户端（multiline_safe=true，多行正文安全）
# ============================================================

[[scene]]
kind = "email"
style = "Formal email writing style. The dictation may be ANY FRAGMENT of an email (often body text only). Format ONLY what was spoken — NEVER add a salutation, closing, signature, greeting, or any sentence the speaker did not say; do NOT complete the text into a full email. IF (and only if) the spoken text itself begins with a salutation (Chinese: 尊敬的X / X您好; English: Dear X,; Japanese: 拝啓 X様 / X様 / 〇〇様; Korean: X님 / 안녕하십니까 X님, etc.): put it on its own line ending with a colon — '：' for Chinese, ':' for English/Japanese/Korean — NEVER a comma or period — and start the body on the next line. IF the spoken text itself ends with a closing courtesy (Chinese: 祝好 / 顺祝商祺; English: Best regards,; Japanese: よろしくお願いいたします / 敬具; Korean: 감사합니다 / 이상, etc.): place it on its own line; the pair 此致/敬礼 goes on two separate lines; Japanese 敬具/前略 and Korean 이상 go on their own lines. Body in complete sentences. When the speech contains enumeration markers (第一/第二/首先/其次/最后 / firstly/secondly / まず/次に/最後に / 첫째/둘째/마지막으로 etc.), MUST split into numbered list lines."
multiline_safe = true
exe = [
    "OUTLOOK.EXE",         # Outlook（classic 经典版）
    "olk.exe",             # Outlook（new 新版，2024+ Win11 默认，WebView2 重构）
    "Foxmail.exe",         # Foxmail
    "thunderbird.exe",     # Thunderbird
    "MailMaster.exe",      # 网易邮箱大师
    "YoMail.exe",          # YoMail
    "Mail.exe",            # Windows 10/11 自带邮件（旧版 UWP）
    "HxOutlook.exe",       # Outlook 辅助进程（新版 Outlook 后台进程）
    "eMClient.exe",        # eM Client
    "Spark.exe",           # Spark Mail
    "NewMailEngine.exe",   # 火狐邮件（如有）
]

[[scene]]
kind = "email"
style = "Formal email writing style. The dictation may be ANY FRAGMENT of an email (often body text only). Format ONLY what was spoken — NEVER add a salutation, closing, signature, greeting, or any sentence the speaker did not say; do NOT complete the text into a full email. IF (and only if) the spoken text itself begins with a salutation (Chinese: 尊敬的X / X您好; English: Dear X,; Japanese: 拝啓 X様 / X様 / 〇〇様; Korean: X님 / 안녕하십니까 X님, etc.): put it on its own line ending with a colon — '：' for Chinese, ':' for English/Japanese/Korean — NEVER a comma or period — and start the body on the next line. IF the spoken text itself ends with a closing courtesy (Chinese: 祝好 / 顺祝商祺; English: Best regards,; Japanese: よろしくお願いいたします / 敬具; Korean: 감사합니다 / 이상, etc.): place it on its own line; the pair 此致/敬礼 goes on two separate lines; Japanese 敬具/前略 and Korean 이상 go on their own lines. Body in complete sentences. When the speech contains enumeration markers (第一/第二/首先/其次/最后 / firstly/secondly / まず/次に/最後に / 첫째/둘째/마지막으로 etc.), MUST split into numbered list lines."
