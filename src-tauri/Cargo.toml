[package]
name = "feiyin-ime-ui"
version = "0.7.2"
description = "Settings UI for voice-ime"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
anyhow = "1"
toml = "0.8"
dirs = "5"
cpal = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
crossbeam-channel = "0.5"
atomic-write-file = "0.3.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"

# BUG-QWEN3-CRYPTO-001: 显式安装 rustls ring provider，解决 aws-lc-rs/ring 冲突 panic
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_ToolHelp"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
