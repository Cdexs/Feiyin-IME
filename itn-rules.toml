# itn-rules.toml — ITN-SMART-001 智能数字规整规则配置
#
# 本文件是中文数字→阿拉伯数字转换的规则数据，与 src/itn.rs 算法分离。
# 内置默认通过 include_str! 嵌入同一份文件；运行时 exe 同级存在则覆盖。
# Gavin 可手动编辑此文件调整规则，无需改代码。
#
# 开关说明：
# - convert_single_digit_with_classifier: 单字数字+通用量词是否转换（false=保留"三个人"）
# - below_zero_style: 零下温度输出风格（"text"=零下10度, "minus"=-10度）
# - large_amount_keep_wan_yi: 大金额保留万/亿单位（true=3500万元不展开为35000000元）

[switches]
convert_single_digit_with_classifier = false
below_zero_style = "text"
large_amount_keep_wan_yi = true

# ============================================================
# 单位词表 — 跟在数字后面触发转换（单字数字也转）
# ============================================================

# 货币单位
[units.currency]
words = ["元", "块", "角", "毛", "分"]

# 长度单位
[units.length]
words = ["米", "公里", "厘米", "毫米", "千米", "里", "寸", "尺", "丈"]

# 重量单位
[units.weight]
words = ["千克", "公斤", "斤", "克", "吨", "毫克", "磅"]

# 容积单位
[units.volume]
words = ["升", "毫升"]

# 温度单位
[units.temperature]
words = ["度", "摄氏度"]

# 压力单位
[units.pressure]
words = ["帕", "千帕", "兆帕", "巴", "大气压"]

# 电学单位
[units.electrical]
words = ["伏", "安", "瓦", "千瓦", "毫安", "度电"]

# 频率单位
[units.frequency]
words = ["赫兹", "兆赫", "千赫"]

# 声学单位
[units.acoustic]
words = ["分贝"]

# 数据单位
[units.data]
words = ["GB", "MB", "TB", "KB", "G", "字节"]

# 时间度量衡单位（量词穿透用，区别于 date_time.triggers.suffix 的点/分/秒）
[units.time]
words = ["小时", "分钟"]

# 其他单位（岁/楼/层/号/房间/倍/页/章/节/条/款/名/次/台/辆/间/句/篇）
[units.other]
words = ["岁", "楼", "层", "号", "房间", "倍", "页", "章", "节", "条", "款", "名", "次", "台", "辆", "间", "句", "篇"]

# 经纬度前缀
[units.geo_prefix]
words = ["东经", "西经", "北纬", "南纬"]

# ============================================================
# ITN-V2-004 (P4) 单位层级表 — 丙型多级单位链合并用
# 每族按层级降序，value 是相对主单位的倍率
# 可小数化单位表 = 以下各族，排除 units.other / units.geo_prefix
# ============================================================

[unit_hierarchy.currency]
"元" = 1.0
"块" = 1.0
"角" = 0.1
"毛" = 0.1
"分" = 0.01

[unit_hierarchy.length]
"米" = 1.0
"分米" = 0.1
"厘米" = 0.01
"毫米" = 0.001

[unit_hierarchy.weight]
"吨" = 1000.0
"千克" = 1.0
"公斤" = 1.0
"克" = 0.001

[unit_hierarchy.time]
"小时" = 1.0
"分钟" = 0.016666667
"分" = 0.016666667
"秒" = 0.000277778

# ============================================================
# 日期时间触发词 — 跟在数字后或前面触发时间语境
# ============================================================

[date_time.triggers]
# 数字后面的时间单位
suffix = ["年", "月", "日", "号", "点", "分", "秒", "刻"]
# 特殊时间词
special = ["半", "刻"]
# 数字前面的时段词
prefix = ["上午", "下午", "凌晨", "晚上", "中午", "傍晚", "清晨"]

# ============================================================
# 序数触发词 — 前缀触发单字数字也转
# ============================================================

[ordinal]
prefix = "第"

# ============================================================
# 百分比触发词
# ============================================================

[percentage]
prefix = "百分之"

# ============================================================
# 分数格式触发词
# ============================================================

[fraction]
# "X分之Y" 格式，分之中间的数字需解析
pattern = "分之"

# ============================================================
# 保护白名单 — 含数字的成语/惯用语，整词保护不转换
# ============================================================

