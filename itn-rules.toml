# 含数字的历史朝代/典籍/制度/民俗/文学等专有词汇，整词保护不转换
# 分类注释便于维护，新增条目按分类归位即可
# ============================================================

[protect.historical]
words = [
    # —— 历史朝代/时期/事件 ——
    "五代十国", "春秋五霸", "战国七雄", "五胡十六国", "三国两晋",
    "三国鼎立", "三国志", "三分天下", "五代", "十国",
    "南北朝", "五胡乱华", "八王之乱", "七国之乱", "三藩之乱",
    "田氏代齐",

    # —— 典籍/制度/思想 ——
    "四书五经", "三纲五常", "五常", "三教九流", "六艺",
    "九章算术", "三十六计", "八股文", "九鼎", "三字经",
    "百家姓", "千字文", "论语二十篇", "诗经三百篇",

    # —— 文化符号/民俗/节气 ——
    "三皇五帝", "九五之尊", "二十四节气", "二十四孝", "双十一",
    "三伏", "三九", "九九重阳", "七夕", "五谷", "六畜",
    "五行", "八卦阵", "四君子", "岁寒三友",
    "文房四宝", "五岳", "四海", "四海八荒", "十八般武艺",
    "十万八千里", "七十二变", "三十六计走为上计",

    # —— 文学/人物/流派 ——
    "四大名著", "四大发明", "初唐四杰", "唐宋八大家", "竹林七贤",
    "建安七子", "江南四大才子", "大历十才子", "苏门四学士",
    "三苏", "三曹", "二王", "颜柳", "楷书四大家",
    "三言二拍", "四大名捕", "四大徽班", "四大须生", "四大名旦",

    # —— 其他含数字的固定词组 ——
    "三从四德", "三省吾身", "三省", "三宝", "三清", "三界",
    "三魂七魄", "七窍", "七情六欲", "九霄", "九泉", "九天",
    "十二生肖", "十二时辰", "十二经络", "奇经八脉", "五脏六腑",
    "筋骨皮", "一气化三清", "两仪", "四象", "六合",
]

[protect.function_words]
# 虚词"一"的常见搭配，不转换
words = [
    "一样", "一起", "一下", "一直", "一定", "一些", "一般",
    "一会儿", "一下子", "一路", "一面", "一边", "一种",
    "一切", "一时", "一生", "一致", "一同", "一味",
]

[protect.classifiers]
# 通用量词表 — 单字数字+这些量词时不转（开关控制）
words = [
    "个", "件", "位", "名", "次", "只", "条", "张", "份",
    "台", "辆", "间", "句", "篇", "本", "部", "场", "组",
    "批", "种", "类", "段", "堆", "瓶", "盒", "包", "箱",
]

# ============================================================
# ITN-CELSIUS-003: 单位符号规整 — 对已是阿拉伯数字的文本生效
# 在中文数字转换（上方）之后独立运行，不依赖中文数字解析路径。
# 幂等：f(f(x))==f(x)（40℃ 再跑一遍仍 40℃，因 ℃ 不匹配任何 trigger）
#
# trigger = 数字后紧跟的文本（最长匹配优先）
# replacement = 替换为的符号
# 数字部分原样保留，仅 trigger → replacement 被替换
#
# ⚠️ 单说「度」绝不在此列 — 角度/温度同形，强转会把「转90度」变「转90℃」
# ============================================================

[[unit_symbols.rules]]
trigger = "摄氏度"
replacement = "℃"

[[unit_symbols.rules]]
# 缺「度」字也转（40摄氏 → 40℃），与「摄氏度」行为一致
trigger = "摄氏"
replacement = "℃"

[[unit_symbols.rules]]
# U+00B0 度符号 + C → U+2103 摄氏度符号（ITN-CELSIUS-002-SYMBOL 原始意图落地）
trigger = "°C"
replacement = "℃"