# ============================================================
# ITN-CELSIUS-003: 单位符号规整 — 对已是阿拉伯数字的文本生效
# 在中文数字转换（上方）之后独立运行，不依赖中文数字解析路径。
# 幂等：f(f(x))==f(x)（40℃ 再跑一遍仍 40℃，因 ℃ 不匹配任何 trigger）
#
# trigger = 数字后紧跟的文本（最长匹配优先）
# replacement = 替换为的符号
# 数字部分原样保留，仅 trigger → replacement 被替换
#
# ⚠️ 单说「度」绝不在此列 — 角度/温度同形，强转会把「转90度」变「转90℃」
# ============================================================

[[unit_symbols.rules]]
trigger = "摄氏度"
replacement = "℃"

[[unit_symbols.rules]]
# 缺「度」字也转（40摄氏 → 40℃），与「摄氏度」行为一致
trigger = "摄氏"
replacement = "℃"

[[unit_symbols.rules]]
# U+00B0 度符号 + C → U+2103 摄氏度符号（ITN-CELSIUS-002-SYMBOL 原始意图落地）
trigger = "°C"
replacement = "℃"

