# itn-rules.toml — ITN-SMART-001 智能数字规整规则配置
#
# 本文件是中文数字→阿拉伯数字转换的规则数据，与 src/itn.rs 算法分离。
# 内置默认通过 include_str! 嵌入同一份文件；运行时 exe 同级存在则覆盖。
# Gavin 可手动编辑此文件调整规则，无需改代码。
#
# 开关说明：
# - convert_single_digit_with_classifier: 单字数字+通用量词是否转换（false=保留"三个人"）
# - below_zero_style: 零下温度输出风格（"text"=零下10度, "minus"=-10度）
# - large_amount_keep_wan_yi: 大金额保留万/亿单位（true=3500万元不展开为35000000元）

[switches]
convert_single_digit_with_classifier = false
below_zero_style = "text"
large_amount_keep_wan_yi = true

# ============================================================
# 单位词表 — 跟在数字后面触发转换（单字数字也转）
# ============================================================

# 货币单位
[units.currency]
words = ["元", "块", "角", "毛", "分"]

# 长度单位
[units.length]
words = ["米", "公里", "厘米", "毫米", "千米", "里", "寸", "尺", "丈"]

# 重量单位
[units.weight]
words = ["千克", "公斤", "斤", "克", "吨", "毫克", "磅"]

# 容积单位
[units.volume]
words = ["升", "毫升"]

# 温度单位
[units.temperature]
words = ["度", "摄氏度"]

# 压力单位
[units.pressure]
words = ["帕", "千帕", "兆帕", "巴", "大气压"]

# 电学单位
[units.electrical]
words = ["伏", "安", "瓦", "千瓦", "毫安", "度电"]

# 频率单位
[units.frequency]
words = ["赫兹", "兆赫", "千赫"]

# 声学单位
[units.acoustic]
words = ["分贝"]

# 数据单位
[units.data]
words = ["GB", "MB", "TB", "KB", "G", "字节"]

# 其他单位（岁/楼/层/号/房间/倍/页/章/节/条/款/名/次/台/辆/间/句/篇）
[units.other]
words = ["岁", "楼", "层", "号", "房间", "倍", "页", "章", "节", "条", "款", "名", "次", "台", "辆", "间", "句", "篇"]

# 经纬度前缀
[units.geo_prefix]
words = ["东经", "西经", "北纬", "南纬"]

# ============================================================
# 日期时间触发词 — 跟在数字后或前面触发时间语境
# ============================================================

[date_time.triggers]
# 数字后面的时间单位
suffix = ["年", "月", "日", "号", "点", "分", "秒", "刻"]
# 特殊时间词
special = ["半", "刻"]
# 数字前面的时段词
prefix = ["上午", "下午", "凌晨", "晚上", "中午", "傍晚", "清晨"]

# ============================================================
# 序数触发词 — 前缀触发单字数字也转
# ============================================================

[ordinal]
prefix = "第"

# ============================================================
# 百分比触发词
# ============================================================

[percentage]
prefix = "百分之"

# ============================================================
# 分数格式触发词
# ============================================================

[fraction]
# "X分之Y" 格式，分之中间的数字需解析
pattern = "分之"

# ============================================================
# 保护白名单 — 含数字的成语/惯用语，整词保护不转换
# ============================================================

[protect.idioms]
# 含数字的成语/惯用语（35+ 条）
words = [
    "三心二意", "一心一意", "七上八下", "五花八门", "四面八方",
    "九牛一毛", "十全十美", "一举两得", "一模一样", "乱七八糟",
    "不三不四", "说三道四", "丢三落四", "朝三暮四", "五颜六色",
    "六神无主", "七零八落", "横七竖八", "八九不离十", "一五一十",
    "三三两两", "千军万马", "万无一失", "一石二鸟", "两全其美",
    "三言两语", "四平八稳", "五湖四海", "九死一生", "十拿九稳",
    "百发百中", "千方百计", "万紫千红", "一目十行", "半斤八两",
    "三令五申", "接二连三", "成千上万", "千千万万", "百里挑一",
    "一步登天", "一帆风顺", "二话不说", "三番五次", "四分五裂",
]

[protect.proper_nouns]
# 含数字的专有名词
words = [
    "三亚", "四川", "九江", "五一", "十一", "二锅头", "三峡",
    "八达岭", "七星", "八卦", "九州", "六盘水", "零陵",
    "五一广场", "十一国庆", "二人转", "四合院", "五台山",
    "九华山", "八宝山", "百慕大", "千岛湖", "万里长城",
    "七一", "八一", "十一月", "十二月", "一九四九", "二零零八",
    # —— 几何图形术语（ITN-GEOMETRIC-001）——
    # 根因：「角」在 units.currency，is_unit 用 starts_with → 「角形」误判为单位语境
    # 整词保护，check_protection 先于 parse_cn_number 运行
    # 主控补漏（验收 2026-07-30）：原清单缺「八角形」。coder-1 因「八角」有歧义而整体跳过八，
    # 但 check_protection 是整词前缀匹配（src/itn.rs rest.starts_with(noun)），
    # 白名单条目「八角形」只会命中「八角形」，**不会**影响裸「八角」的货币转换 —— 歧义顾虑不外溢到「八角形」。
    "三角形", "四角形", "五角形", "六角形", "七角形", "八角形", "九角形", "十角形",
    "四边形", "五边形", "六边形", "七边形", "八边形", "九边形", "十边形",
    "十一边形", "十二边形", "多边形", "正三角形", "等腰三角形", "直角三角形",
    "四面体", "五面体", "六面体", "八面体", "十二面体", "二十面体",
    # —— 「角」族复合词（数字+角X，同根因）——
    # 注意：「八角」不纳入——既可能是香料也可能是「8角钱」，属真歧义
    "三角洲", "三角债", "三角恋", "三角关系", "三角函数", "三角学", "三角铁",
    "三角架", "三角旗", "三角板", "三角尺", "三角钢琴",
]

# ============================================================
