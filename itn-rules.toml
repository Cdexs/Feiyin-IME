#   THUOCL (MIT, https://github.com/thunlp/THUOCL)
#   Citation: Han et al., THUOCL: Tsinghua Open Chinese Lexicon, 2016.
#   CC-CEDICT 已剔除：CC BY-SA 4.0 的 share-alike 条款对派生数据存在传染性解释空间。
